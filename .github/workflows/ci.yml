name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # 普通构建 + 全部测试(编译器矩阵)
  build-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # CC/CXX 必须分别是 C/C++ 编译器:CC 填 g++ 会挂掉 CMake 的 C 编译器测试
        compiler: ["gcc-11", "gcc-12"]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc-11' && 'g++-11' || 'g++-12' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libtinyxml2-dev cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      # 说明:不在此处用 nebula validate 校验示例树——树引用业务动作,
      # 裸 CLI(未注册动作)必然报 Node not recognized。等价门禁已由
      # robot_delivery 示例的 loadPack 测试覆盖(加载即校验全部树)。

  # 消毒器(测试加固)。TSan 因 GCC 11/12 对 timed cv 建模不全误报,
  # 暂不入门禁(见 docs/DESIGN.md 已知限制),升级运行时后补
  sanitizer:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["address", "undefined"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libtinyxml2-dev cmake

      - name: Configure (${{ matrix.sanitize }})
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
                  -DNEBULABT_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  # 可选 YAML 清单支持(零依赖不受影响;验证 pack.yaml 加载路径)
  yaml-manifest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libtinyxml2-dev cmake libyaml-cpp-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEBULABT_WITH_YAML=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  # 覆盖率(库源码;报告上传为 artifact 并写入 job summary)
  coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libtinyxml2-dev cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
                  -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Coverage report
        run: |
          cd build/CMakeFiles
          find . -name "*.cpp.o" | while read o; do
            gcov -o "$(dirname "$o")" "$o" >/dev/null 2>&1 || true
          done
          python3 scripts/coverage.py "$PWD" | tee coverage_report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/CMakeFiles/coverage_report.txt
